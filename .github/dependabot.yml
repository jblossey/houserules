# Dependabot: weekly version updates for the Rust crates and the GitHub
# Actions the workflows pin. The commit prefix keeps every PR title a
# conventional commit so the check-commit gate accepts it.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
