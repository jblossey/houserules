# Publishes schemas/ to GitHub Pages, so that a schema file is at
# https://jblossey.github.io/houserules/schemas/<name>/<semver>.json.
# The repository setting for Pages must name the source "GitHub Actions".
name: schemas

on:
  push:
    branches: [main]
    paths: ['schemas/**']
  workflow_dispatch:

permissions:
  contents: read

# A deployment that runs finishes before the next one starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The site root holds the directory schemas/, so a file keeps its schemas/ segment in its URL.
      - name: Stage the site
        shell: bash
        run: |
          mkdir _site
          cp -R schemas _site/schemas
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
