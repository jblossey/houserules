name: dependabot-auto-merge
# For a minor or patch Dependabot update, the owner's fine-grained token
# approves the PR and then enables auto-merge (rebase, the only merge method
# the main ruleset allows). An enabled auto-merge waits for every ruleset
# requirement, the approving review included, so the approval comes first
# (houserules.auto-merge-waits-for-every-ruleset-rule).
# A major update gets neither: the code owner reviews it.
#
# The owner's token acts, not GITHUB_TOKEN: GitHub starts no workflow run for an
# event that GITHUB_TOKEN creates (houserules.default-token-tags-start-no-workflows).
# The only secrets a workflow that a Dependabot event triggers can read are Dependabot
# secrets (https://docs.github.com/en/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions),
# so the token lives there: `gh secret set DEPENDABOT_AUTOMERGE_TOKEN --app dependabot`.
on:
  pull_request:

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'jblossey/houserules'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: |
          decision=$(gh pr view "$PR_URL" --json reviewDecision --jq .reviewDecision)
          if [ "$decision" != "APPROVED" ]; then
            gh pr review --approve "$PR_URL"
          fi
      - if: >
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        shell: bash
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN }}
        run: gh pr merge --auto --rebase "$PR_URL"
