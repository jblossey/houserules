# The review layer of houserules for GitHub, as a reusable workflow.
#
# The workflow has five jobs: gates, floor, report, record, and record-push.
# Only report and record-push hold a write scope. Neither of them runs
# houserules, the setup command, or code of the repository. A job that runs
# houserules or the setup command reads the code with a read-only token.
#
# A value that a request controls reaches a script through the environment or
# through a file. No run script holds an expression.
#
# The caller triggers on pull_request (with the edited type) and on push to the
# default branch. It never triggers on pull_request_target, because gates runs
# the code of the request.
#
# This file holds no release version. The version input names the release that
# install and floor-install install. A person raises the minimum version below,
# by hand, in the change that makes this unit call a newer command.
name: houserules review

on:
  workflow_call:
    inputs:
      version:
        description: The houserules release that install and floor-install install when they are release, for example 2.0.0. Needed only for a release install.
        type: string
        default: ''
      dir:
        description: The path of the houserules install below the git top level.
        type: string
        default: .
      key:
        description: The name of this install in artifact names and concurrency groups; root for a top-level install.
        type: string
        default: root
      setup:
        description: A shell command that runs before the audit in the gates and record jobs, for example a build of the project tools.
        type: string
        default: ''
      validation:
        description: The path, relative to the install, of a capture of openspec validate --json that the setup command writes with houserules capture. When the file exists, evidence and record write read it. Empty passes no capture.
        type: string
        default: ''
      install:
        description: release installs the version input; none expects the setup command to put houserules on the PATH.
        type: string
        default: release
      floor-install:
        description: 'The binary of the floor job. release installs the version input; runner:<path> uses an executable that the runner provides at an absolute path, only on a fresh runner or an unwritable path; default-branch builds houserules from the default branch with cargo.'
        type: string
        default: release
      tracker:
        description: The tracker of the install, for the jobs that resolve work items. github reads issues with the job token; beads bootstraps the store. json or empty needs nothing.
        type: string
        default: ''

env:
  HOUSERULES_MINIMUM_VERSION: '2.0.0'
  HOUSERULES_ERROR_PREFIX: '::error::'
  HOUSERULES_NOTICE_PREFIX: '::notice::'
  HOUSERULES_SH: |
    hr_fail() {
      printf '%s%s\n' "${HOUSERULES_ERROR_PREFIX-}" "$1"
      exit 1
    }
    hr_notice() {
      printf '%s%s\n' "${HOUSERULES_NOTICE_PREFIX-}" "$1"
    }
    hr_bin() {
      printf '%s/houserules-bin' "${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
    }
    hr_use_bin() {
      PATH="$1:$PATH"
      export PATH
      if [ -n "${GITHUB_PATH:-}" ]; then
        printf '%s\n' "$1" >> "$GITHUB_PATH"
      fi
    }
    hr_at_least() {
      awk -v have="$1" -v need="$2" '
        function core(v, s) { s = v; sub(/[-+].*/, "", s); return s }
        BEGIN {
          split(core(have), h, ".")
          split(core(need), n, ".")
          for (i = 1; i <= 3; i++) {
            if (h[i] + 0 > n[i] + 0) exit 0
            if (h[i] + 0 < n[i] + 0) exit 1
          }
          older = (have ~ /-/ && need !~ /-/) ? 1 : 0
          exit older
        }'
    }
    hr_check_minimum() {
      [ -n "${HOUSERULES_MINIMUM_VERSION:-}" ] || return 0
      hr_found=$(houserules --version) || hr_fail "houserules: the installed binary does not run"
      hr_found=${hr_found##* }
      hr_at_least "$hr_found" "$HOUSERULES_MINIMUM_VERSION" || hr_fail "houserules $hr_found is older than $HOUSERULES_MINIMUM_VERSION, which this unit needs; raise the version input"
    }
    hr_install_release() {
      [ -n "${HOUSERULES_VERSION:-}" ] || hr_fail "houserules: the version input is required when install or floor-install is release"
      if ! printf '%s\n' "$HOUSERULES_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'; then
        hr_shown=$(printf '%s' "$HOUSERULES_VERSION" | tr -c '0-9A-Za-z.+-' '?' | cut -c1-40)
        hr_fail "houserules: the version '$hr_shown' is not a release version such as MAJOR.MINOR.PATCH"
      fi
      hr_url="https://github.com/jblossey/houserules/releases/download/v${HOUSERULES_VERSION}/houserules-installer.sh"
      hr_installer=$(curl --proto '=https' --tlsv1.2 -LsSf "$hr_url") || hr_fail "houserules: cannot download $hr_url; the release does not exist, has no installer, or GitHub was unreachable"
      printf '%s\n' "$hr_installer" | HOUSERULES_UNMANAGED_INSTALL="$(hr_bin)" sh || hr_fail "houserules: the installer of release $HOUSERULES_VERSION failed"
      [ -x "$(hr_bin)/houserules" ] || hr_fail "houserules: the installer of release $HOUSERULES_VERSION wrote no binary"
      hr_use_bin "$(hr_bin)"
      hr_check_minimum
    }
    hr_build_default_branch() {
      hr_src=${HOUSERULES_DEFAULT_SRC:-}
      [ -f "$hr_src/crates/houserules/Cargo.toml" ] || hr_fail "houserules: the default branch holds no crates/houserules, so floor-install default-branch cannot build it"
      hr_root="$(hr_bin)-build"
      (
        cd "$hr_src" || exit 1
        if command -v rustup > /dev/null 2>&1; then
          hr_toolchain=$(rustup show active-toolchain 2> /dev/null | awk 'NR == 1 { print $1 }') || hr_toolchain=
          if [ -n "$hr_toolchain" ]; then
            RUSTUP_TOOLCHAIN=$hr_toolchain
            export RUSTUP_TOOLCHAIN
          fi
        fi
        cargo install --locked --path "$hr_src/crates/houserules" --bin houserules --root "$hr_root"
      ) || hr_fail "houserules: cargo cannot build houserules from the default branch"
      hr_use_bin "$hr_root/bin"
    }
    hr_link_runner_binary() {
      [ -f "$1" ] && [ -x "$1" ] || hr_fail "houserules: floor-install runner:$1 names no executable file on this runner"
      mkdir -p "$(hr_bin)"
      ln -sf "$1" "$(hr_bin)/houserules"
      hr_use_bin "$(hr_bin)"
    }
    hr_install() {
      case "$2:$1" in
        install:release | floor:release) hr_install_release ;;
        install:none) ;;
        floor:none) hr_fail "houserules: floor-install must not be none, because the floor must not run a binary that the request built" ;;
        floor:default-branch) hr_build_default_branch ;;
        floor:runner:/*) hr_link_runner_binary "${1#runner:}" ;;
        floor:runner:*) hr_fail "houserules: floor-install runner:<path> needs an absolute path" ;;
        install:*) hr_fail "houserules: install must be release or none" ;;
        *) hr_fail "houserules: floor-install must be release, default-branch, or runner:<path>" ;;
      esac
    }
    hr_require_binary() {
      command -v houserules > /dev/null 2>&1 || hr_fail "houserules: houserules is not on the PATH, so with install none the setup command must put it there"
    }
    hr_intent() {
      # LC_ALL=C: [[:space:]] is then the ASCII set that bundle check reads (spec 7.1), in every locale
      LC_ALL=C awk '
        function ticks(line, count) {
          count = 0
          while (substr(line, count + 1, 1) == "`") count++
          return count
        }
        BEGIN { fence = 0; in_section = 0 }
        {
          run = ticks($0)
          rest = substr($0, run + 1)
          if (fence > 0) {
            if (run >= fence && rest ~ /^[[:space:]]*$/) fence = 0
            next
          }
          if (run >= 3 && index(rest, "`") == 0) { fence = run; next }
          if (in_section && /^## /) exit
          if (/^## Evidence bundle[[:space:]]*$/) { in_section = 1; next }
          if (in_section && /^Intent:/) { sub(/^Intent:[[:space:]]*/, ""); sub(/[[:space:]]*$/, ""); print; exit }
        }
      ' "$1"
    }
    hr_validation_file() {
      [ -n "${HOUSERULES_VALIDATION:-}" ] || return 0
      printf '%s/%s' "${HOUSERULES_DIR%/}" "$HOUSERULES_VALIDATION"
    }
    hr_validation_exists() {
      hr_candidate=$(hr_validation_file)
      [ -n "$hr_candidate" ] || return 1
      if [ -f "$hr_candidate" ]; then
        return 0
      fi
      hr_notice "houserules: the validation input names $hr_candidate, which does not exist, so this run passes no validation capture"
      return 1
    }
    hr_notes_ref() {
      hr_dir=${1#./}
      hr_dir=${hr_dir%/}
      case $hr_dir in
        '' | .) printf 'refs/notes/houserules' ;;
        *) printf 'refs/notes/houserules-sub/%s' "$hr_dir" ;;
      esac
    }
    hr_fetch_notes() {
      hr_listed=$(hr_git ls-remote "$1" "$2") || hr_fail "houserules: cannot read the notes ref $2 from the remote"
      if printf '%s\n' "$hr_listed" | awk -v ref="$2" '$2 == ref { found = 1 } END { exit !found }'; then
        hr_git fetch -q --no-tags "$1" "+$2:$3" || hr_fail "houserules: cannot fetch the notes ref $2"
        return 0
      fi
      return 1
    }
    hr_push_note() {
      hr_side=refs/notes/houserules-fetched
      GIT_AUTHOR_NAME=houserules
      GIT_AUTHOR_EMAIL=houserules@users.noreply.invalid
      GIT_COMMITTER_NAME=houserules
      GIT_COMMITTER_EMAIL=houserules@users.noreply.invalid
      export GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
      hr_git fetch -q --no-tags --depth=1 "$1" "$3" || hr_fail "houserules: cannot fetch the commit $3"
      hr_tries=0
      while [ "$hr_tries" -lt 3 ]; do
        hr_tries=$((hr_tries + 1))
        if hr_fetch_notes "$1" "$2" "$hr_side"; then
          if git notes --ref="$hr_side" show "$3" > /dev/null 2>&1; then
            hr_notice "houserules: the remote notes ref already holds a record for $3, and it stays as it is"
            return 0
          fi
          if git rev-parse -q --verify "$2" > /dev/null; then
            git notes --ref="$2" merge -q -s theirs "$hr_side"
          else
            git update-ref "$2" "$hr_side"
          fi
        fi
        if ! git notes --ref="$2" show "$3" > /dev/null 2>&1; then
          git notes --ref="$2" add -F "$4" "$3"
        fi
        if hr_git push -q "$1" "$2:$2" > /dev/null 2>&1; then
          return 0
        fi
      done
      hr_fail "houserules: the remote rejected the notes ref $2 three times; run the job again"
    }

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      GH_TOKEN: ${{ inputs.tracker == 'github' && github.token || '' }}
      HOUSERULES_DIR: ${{ inputs.dir }}
      HOUSERULES_KEY: ${{ inputs.key }}
      HOUSERULES_VALIDATION: ${{ inputs.validation }}
      HOUSERULES_BASE: ${{ github.event.pull_request.base.sha }}
      HOUSERULES_HEAD: ${{ github.event.pull_request.head.sha }}
      HOUSERULES_AUTHOR: ${{ github.event.pull_request.user.login }}
      HOUSERULES_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: ${{ inputs.tracker == 'beads' }}
      - name: Install houserules
        shell: bash
        env:
          HOUSERULES_VERSION: ${{ inputs.version }}
          HOUSERULES_SOURCE: ${{ inputs.install }}
        run: |
          eval "$HOUSERULES_SH"
          hr_install "$HOUSERULES_SOURCE" install
      - name: Run setup
        if: ${{ inputs.setup != '' }}
        shell: bash
        env:
          HOUSERULES_SETUP: ${{ inputs.setup }}
        run: eval "$HOUSERULES_SETUP"
      - name: Require houserules
        shell: bash
        run: |
          eval "$HOUSERULES_SH"
          hr_require_binary
      - name: Install bd
        if: ${{ inputs.tracker == 'beads' }}
        shell: bash
        run: |
          set -euo pipefail
          archive=beads_1.3.1_linux_amd64.tar.gz
          base=https://github.com/gastownhall/beads/releases/download/v1.3.1
          mkdir -p "$RUNNER_TEMP/bd"
          cd "$RUNNER_TEMP/bd"
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/$archive"
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"
      - name: Bootstrap the Beads store
        if: ${{ inputs.tracker == 'beads' }}
        shell: bash
        env:
          BD_DISABLE_METRICS: '1'
          DO_NOT_TRACK: '1'
        run: bd bootstrap --yes
      - name: Check the knowledge base
        shell: bash
        run: houserules check-knowledge --dir "$HOUSERULES_DIR"
      - name: Check the backlog
        shell: bash
        run: houserules check-backlog --dir "$HOUSERULES_DIR"
      - name: Write the request description
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/houserules-evidence-$HOUSERULES_KEY"
          mkdir -p "$out"
          jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" > "$out/description.md"
      - name: Audit the request
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/houserules-evidence-$HOUSERULES_KEY"
          houserules audit --base "$HOUSERULES_BASE" --head "$HOUSERULES_HEAD" --json "$out/audit.json" --dir "$HOUSERULES_DIR"
      - name: Check the evidence bundle
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/houserules-evidence-$HOUSERULES_KEY"
          houserules bundle check --body "$out/description.md" --base "$HOUSERULES_BASE" --head "$HOUSERULES_HEAD" --author="$HOUSERULES_AUTHOR" --head-ref="$HOUSERULES_HEAD_REF" --dir "$HOUSERULES_DIR"
      - name: Write the evidence packet
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          eval "$HOUSERULES_SH"
          out="$RUNNER_TEMP/houserules-evidence-$HOUSERULES_KEY"
          args=(--base "$HOUSERULES_BASE" --head "$HOUSERULES_HEAD" --dir "$HOUSERULES_DIR")
          if [ -s "$out/audit.json" ]; then
            args+=(--audit "$out/audit.json")
          fi
          if hr_validation_exists; then
            args+=(--validation "$(hr_validation_file)")
          fi
          intent=$(hr_intent "$out/description.md")
          if [ -n "$intent" ]; then
            houserules evidence "${args[@]}" --intent="$intent" --out "$out/evidence.md" --json "$out/evidence.json" || houserules evidence "${args[@]}" --out "$out/evidence.md" --json "$out/evidence.json"
          else
            houserules evidence "${args[@]}" --out "$out/evidence.md" --json "$out/evidence.json"
          fi
          cat "$out/evidence.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Write the route
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        shell: bash
        run: |
          out="$RUNNER_TEMP/houserules-evidence-$HOUSERULES_KEY"
          args=(--base "$HOUSERULES_BASE" --head "$HOUSERULES_HEAD" --dir "$HOUSERULES_DIR")
          if [ -s "$out/audit.json" ]; then
            args+=(--audit "$out/audit.json")
          fi
          houserules route "${args[@]}" --json "$out/route.json"
      - name: Upload the evidence
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: houserules-evidence-${{ inputs.key }}
          path: ${{ runner.temp }}/houserules-evidence-${{ inputs.key }}
          if-no-files-found: ignore

  floor:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      route: ${{ steps.route.outputs.route }}
    env:
      HOUSERULES_DIR: ${{ inputs.dir }}
      HOUSERULES_BASE: ${{ github.event.pull_request.base.sha }}
      HOUSERULES_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      # The request goes into a folder of its own. cargo reads .cargo/config.toml in the folders
      # above the source it builds, and rustup reads rust-toolchain.toml above its working
      # directory, so the default branch and every folder above it hold no file of the request.
      - name: Check out the request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: houserules-request
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the default branch
        if: ${{ inputs.floor-install == 'default-branch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: houserules-default-branch
          persist-credentials: false
      - name: Install houserules
        shell: bash
        env:
          HOUSERULES_VERSION: ${{ inputs.version }}
          HOUSERULES_SOURCE: ${{ inputs.floor-install }}
          HOUSERULES_DEFAULT_SRC: ${{ github.workspace }}/houserules-default-branch
        run: |
          eval "$HOUSERULES_SH"
          hr_install "$HOUSERULES_SOURCE" floor
      - name: Compute the floor
        id: route
        shell: bash
        working-directory: houserules-request
        run: |
          houserules route --no-audit --base "$HOUSERULES_BASE" --head "$HOUSERULES_HEAD" --json "$RUNNER_TEMP/houserules-floor.json" --dir "$HOUSERULES_DIR"
          route=$(jq -r '.route // empty' "$RUNNER_TEMP/houserules-floor.json" 2> /dev/null) || route=
          case $route in
            auto-merge-eligible | owner-review | senior-review) printf 'route=%s\n' "$route" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::houserules: route --no-audit wrote no valid route"; exit 1 ;;
          esac

  report:
    needs: [gates, floor]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
      issues: write
    concurrency:
      group: houserules-report-${{ inputs.key }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      HOUSERULES_ROUTE_SH: |
        hr_route_of() {
          [ -f "$1" ] || return 0
          jq -r 'if (.route | type) == "string" and (.route == "auto-merge-eligible" or .route == "owner-review" or .route == "senior-review") then .route else empty end' "$1" 2> /dev/null || true
        }
        hr_route_rank() {
          case $1 in
            auto-merge-eligible) echo 0 ;;
            owner-review) echo 1 ;;
            *) echo 2 ;;
          esac
        }
        applied_route() {
          if [ -z "$4" ] || [ "$3" != "$4" ]; then
            printf 'notice=houserules: the head of the request is not %.7s now, or it cannot be read; this run writes nothing\n' "$3"
            return 0
          fi
          hr_gates=$(hr_route_of "$1")
          hr_floor=$(hr_route_of "$2")
          if [ -z "$hr_gates" ]; then
            printf 'notice=houserules: the gates document is missing or invalid; the floor alone decides\n'
            hr_gates_shown=missing
            hr_gates_rank=0
          else
            hr_gates_shown=$hr_gates
            hr_gates_rank=$(hr_route_rank "$hr_gates")
          fi
          if [ -z "$hr_floor" ]; then
            printf 'notice=houserules: the floor document is missing or invalid; the applied route is at least owner-review\n'
            hr_floor_shown=missing
            hr_floor_rank=1
          else
            hr_floor_shown=$hr_floor
            hr_floor_rank=$(hr_route_rank "$hr_floor")
          fi
          hr_rank=$hr_gates_rank
          if [ "$hr_floor_rank" -gt "$hr_rank" ]; then
            hr_rank=$hr_floor_rank
          fi
          case $hr_rank in
            0) hr_applied=auto-merge-eligible ;;
            1) hr_applied=owner-review ;;
            *) hr_applied=senior-review ;;
          esac
          printf 'route=%s\n' "$hr_applied"
          printf 'line=Applied route: %s (computed %s, floor %s)\n' "$hr_applied" "$hr_gates_shown" "$hr_floor_shown"
        }
    steps:
      - name: Download the evidence
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: houserules-evidence-${{ inputs.key }}
          path: ${{ runner.temp }}/houserules-evidence-${{ inputs.key }}
      - name: Report the route
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOUSERULES_DIR: ${{ inputs.dir }}
          HOUSERULES_KEY: ${{ inputs.key }}
          HOUSERULES_FLOOR_ROUTE: ${{ needs.floor.outputs.route }}
          HOUSERULES_REQUEST: ${{ github.event.pull_request.number }}
          HOUSERULES_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          unset GIT_TRACE GIT_CURL_VERBOSE GIT_TRACE_CURL
          eval "$HOUSERULES_SH"
          eval "$HOUSERULES_ROUTE_SH"
          GH_HOST=${GITHUB_SERVER_URL#*://}
          export GH_HOST
          repo=$GITHUB_REPOSITORY
          out="$RUNNER_TEMP/houserules-evidence-$HOUSERULES_KEY"
          install=${HOUSERULES_DIR#./}
          install=${install%/}
          if [ -z "$install" ]; then
            install=.
          fi
          if [ "$install" = . ]; then
            context='houserules/route'
            label_prefix='houserules'
          else
            context="houserules/route ($install)"
            label_prefix="houserules $install"
          fi
          marker="<!-- houserules:evidence $install -->"
          floor_doc="$RUNNER_TEMP/houserules-floor-$HOUSERULES_KEY.json"
          rm -f "$floor_doc"
          if [ -n "${HOUSERULES_FLOOR_ROUTE:-}" ]; then
            jq -n --arg route "$HOUSERULES_FLOOR_ROUTE" '{route: $route}' > "$floor_doc"
          fi
          current=$(gh api "repos/$repo/pulls/$HOUSERULES_REQUEST" --jq .head.sha) || current=
          result=$(applied_route "$out/route.json" "$floor_doc" "$HOUSERULES_HEAD" "$current")
          printf '%s\n' "$result" | sed -n 's/^notice=//p' | while IFS= read -r notice; do
            hr_notice "$notice"
          done
          route=$(printf '%s\n' "$result" | sed -n 's/^route=//p')
          line=$(printf '%s\n' "$result" | sed -n 's/^line=//p')
          if [ -z "$route" ]; then
            exit 0
          fi
          refused() {
            hr_notice "houserules: GitHub refused a write, so the token may be read-only; the applied route is $route and this run posted nothing more"
            exit 0
          }
          body="$RUNNER_TEMP/houserules-comment-$HOUSERULES_KEY.md"
          {
            printf '%s\n' "$marker"
            printf '%s\n' "$line"
            if [ -f "$out/evidence.md" ]; then
              if [ "$(sed -n 1p "$out/evidence.md")" = "$marker" ]; then
                sed 1d "$out/evidence.md"
              else
                cat "$out/evidence.md"
              fi
            else
              printf '\nhouserules: the gates job wrote no evidence packet.\n'
            fi
          } > "$body"
          jq -Rs '{body: .}' "$body" > "$body.json"
          comments=$(gh api --paginate "repos/$repo/issues/$HOUSERULES_REQUEST/comments?per_page=100") || refused
          comment_id=$(printf '%s\n' "$comments" | jq -rs --arg marker "$marker" 'add // [] | map(select(.user.login == "github-actions[bot]" and ((.body | split("\n")[0] | rtrimstr("\r")) == $marker))) | last | .id // empty')
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$repo/issues/comments/$comment_id" --input "$body.json" > /dev/null || refused
          else
            gh api --method POST "repos/$repo/issues/$HOUSERULES_REQUEST/comments" --input "$body.json" > /dev/null || refused
          fi
          gh api --method POST "repos/$repo/statuses/$HOUSERULES_HEAD" -f state=success -f "context=$context" -f "description=$route" > /dev/null || refused
          for candidate in auto-merge-eligible owner-review senior-review; do
            name="$label_prefix: $candidate"
            gh api --method POST "repos/$repo/labels" -f "name=$name" -f color=1d76db > /dev/null 2>&1 || true
            if [ "$candidate" != "$route" ]; then
              encoded=$(jq -rn --arg v "$name" '$v | @uri')
              gh api --method DELETE "repos/$repo/issues/$HOUSERULES_REQUEST/labels/$encoded" > /dev/null 2>&1 || true
            fi
          done
          gh api --method POST "repos/$repo/issues/$HOUSERULES_REQUEST/labels" -f "labels[]=$label_prefix: $route" > /dev/null || refused

  record:
    if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      written: ${{ steps.write.outputs.written }}
    env:
      GH_TOKEN: ${{ inputs.tracker == 'github' && github.token || '' }}
      HOUSERULES_DIR: ${{ inputs.dir }}
      HOUSERULES_KEY: ${{ inputs.key }}
      HOUSERULES_VALIDATION: ${{ inputs.validation }}
      HOUSERULES_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install houserules
        shell: bash
        env:
          HOUSERULES_VERSION: ${{ inputs.version }}
          HOUSERULES_SOURCE: ${{ inputs.install }}
        run: |
          eval "$HOUSERULES_SH"
          hr_install "$HOUSERULES_SOURCE" install
      - name: Run setup
        if: ${{ inputs.setup != '' }}
        shell: bash
        env:
          HOUSERULES_SETUP: ${{ inputs.setup }}
        run: eval "$HOUSERULES_SETUP"
      - name: Require houserules
        shell: bash
        run: |
          eval "$HOUSERULES_SH"
          hr_require_binary
      - name: Install bd
        if: ${{ inputs.tracker == 'beads' }}
        shell: bash
        run: |
          set -euo pipefail
          archive=beads_1.3.1_linux_amd64.tar.gz
          base=https://github.com/gastownhall/beads/releases/download/v1.3.1
          mkdir -p "$RUNNER_TEMP/bd"
          cd "$RUNNER_TEMP/bd"
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/$archive"
          curl --proto '=https' --tlsv1.2 -fsSLO "$base/checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"
      - name: Bootstrap the Beads store
        if: ${{ inputs.tracker == 'beads' }}
        shell: bash
        env:
          BD_DISABLE_METRICS: '1'
          DO_NOT_TRACK: '1'
        run: bd bootstrap --yes
      - name: Write the record
        id: write
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          eval "$HOUSERULES_SH"
          out="$RUNNER_TEMP/houserules-record-$HOUSERULES_KEY"
          mkdir -p "$out"
          ref=$(hr_notes_ref "$HOUSERULES_DIR")
          key=$GITHUB_SHA
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          hr_git() {
            git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" "$@"
          }
          # The "|| true" tolerates an absent notes ref (return 1). When ls-remote fails, hr_fail exits the
          # job with status 1: this push gets no record until the job runs again.
          hr_fetch_notes origin "$ref" "$ref" || true
          empty_tree=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          base=$HOUSERULES_BEFORE
          if [ -z "${base//0/}" ]; then
            base=$empty_tree
          elif ! git cat-file -e "$base^{commit}" 2> /dev/null; then
            hr_notice "houserules: $(printf '%.7s' "$base") is not in this clone (a force push?); no record for this push"
            exit 0
          fi
          args=(--base "$base" --head "$key" --key "$key" --host github --out "$out/record.json" --dir "$HOUSERULES_DIR")
          if [ "$base" != "$empty_tree" ]; then
            houserules audit --base "$base" --head "$key" --json "$out/audit.json" --dir "$HOUSERULES_DIR" || true
            if [ -s "$out/audit.json" ]; then
              args+=(--audit "$out/audit.json")
            fi
          fi
          if hr_validation_exists; then
            args+=(--validation "$(hr_validation_file)")
          fi
          pr=
          unknown=
          if pulls=$(gh api "repos/$GITHUB_REPOSITORY/commits/$key/pulls?per_page=100"); then
            pr=$(printf '%s\n' "$pulls" | jq -r --arg key "$key" '[.[] | select(.merged_at != null)] | (map(select(.merge_commit_sha == $key)) + .) | .[0].number // empty')
          else
            unknown=yes
          fi
          if [ -n "$pr" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.body // ""' > "$out/description.md"; then
              args+=(--bundle "$out/description.md")
              if reviews=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews?per_page=100"); then
                approvers=$(printf '%s\n' "$reviews" | jq -rs 'add // [] | map(select(.state != "COMMENTED" and .state != "PENDING" and .user != null)) | sort_by(.submitted_at) | group_by(.user.login) | map(last) | map(select(.state == "APPROVED") | .user.login) | .[]')
                while IFS= read -r approver; do
                  if [ -n "$approver" ]; then
                    args+=("--reviewer=$approver")
                  fi
                done <<< "$approvers"
              else
                unknown=yes
              fi
            else
              unknown=yes
            fi
          fi
          if [ -n "$unknown" ]; then
            hr_notice "houserules: the pull requests of $(printf '%.7s' "$key") cannot be read, so the record keeps reviewers_pending"
            args+=(--reviewers-pending)
          fi
          houserules record write "${args[@]}"
          echo "written=true" >> "$GITHUB_OUTPUT"
      - name: Upload the record
        if: ${{ steps.write.outputs.written == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: houserules-record-${{ inputs.key }}
          path: ${{ runner.temp }}/houserules-record-${{ inputs.key }}/record.json
          if-no-files-found: error

  record-push:
    needs: record
    if: ${{ needs.record.outputs.written == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the record
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: houserules-record-${{ inputs.key }}
          path: ${{ runner.temp }}/houserules-record-${{ inputs.key }}
      - name: Push the record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HOUSERULES_DIR: ${{ inputs.dir }}
          HOUSERULES_KEY: ${{ inputs.key }}
        run: |
          unset GIT_TRACE GIT_CURL_VERBOSE GIT_TRACE_CURL
          eval "$HOUSERULES_SH"
          note="$RUNNER_TEMP/houserules-record-$HOUSERULES_KEY/record.json"
          if [ ! -s "$note" ]; then
            hr_fail "houserules: the record job wrote no record"
          fi
          ref=$(hr_notes_ref "$HOUSERULES_DIR")
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          hr_git() {
            git -c "http.${GITHUB_SERVER_URL}/.extraheader=AUTHORIZATION: basic ${auth}" "$@"
          }
          scratch=$(mktemp -d)
          cd "$scratch" || exit 1
          git init -q --bare .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          hr_push_note origin "$ref" "$GITHUB_SHA" "$note"
