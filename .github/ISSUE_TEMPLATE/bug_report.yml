name: Bug report
description: Report a defect in houserules
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you run, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: houserules version
      description: From `.houserules.json`'s `version` field, or your `package.json`.
      placeholder: 0.2.0-alpha
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `tools/kb.sh check` and `tools/backlog.sh check`, and the bug still reproduces.
          required: false
