name: Change request
description: Ask for a new capability or a change to the CLI or the kit.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ask for one change per issue.

        Describe the problem first. We judge a request by the problem it solves, not by the proposed fix.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: What does the change touch?
      options:
        - CLI command (houserules <command>)
        - Install or update (init, update, the installers)
        - Agent template (.claude/agents/)
        - Skill (.claude/skills/)
        - Seeded knowledge, backlog, or schema
        - CI workflow or git hook
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `houserules --version`.
      placeholder: "houserules 1.1.0"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What do you want to do, and what stops you? Give the evidence: where you saw the
        problem, and how often.
      placeholder: |
        In our project, `process.claims-match-artifacts` failed in 7 of 13 tasks. Every failure
        was a stale line number that the report carried over from a draft.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you tried
      description: >-
        Give the commands you ran and what they printed. Write "none" if the problem is not
        about a command.
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: >-
        Describe your repository: its layout (for example, a monorepo), its languages, and the
        other agent tools it uses.
    validations:
      required: false

  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed change
      description: >-
        What must change? Name the commands, flags, or files. Number the items if there is
        more than one.
      placeholder: |
        1. Add a step to `.claude/agents/implementer.md`: re-open every cited line at HEAD.
        2. Make `houserules check-report-claims` resolve each `<file>:<line>` citation.
    validations:
      required: true

  - type: dropdown
    id: surface-impact
    attributes:
      label: Surface impact
      description: >-
        houserules 1.x freezes its CLI commands, their flags, and its schema files. Adding,
        removing, or renaming a command or flag, or changing a schema constraint, needs a major
        version. The maintainer decides. Choose "Not sure" if you do not know.
      options:
        - Not sure
        - No command, flag, or schema change
        - Adds, removes, or renames a command or flag
        - Changes a schema constraint
      default: 0
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
    validations:
      required: false

  - type: textarea
    id: local-workaround
    attributes:
      label: Local workaround
      description: >-
        What does your project do until this lands? For example, an override in
        `.houserules.json` or an extra rule in your own knowledge base.
    validations:
      required: false
