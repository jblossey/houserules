[package]
name = "houserules"
# The kit's one version source (batch 20 T3, HR-047: package.json, the
# earlier lockstep partner, retired with the rest of the JS toolchain).
# dist plan/build resolve a release-please tag by this field alone
# (CARGO_PKG_VERSION), so a drift here breaks every future release (batch
# 19 T1 fix round 1, review issue 2). release-please-config.json's one
# package now names this path with release-type "rust" (HR-073, batch 20
# T5): release-please bumps this field itself, in its own PR, the same
# way "node" once bumped package.json; never hand-edit it otherwise.
version = "2.0.0"
edition = "2024"
rust-version = "1.98"
description = "A CLI that makes your AI coding agents adhere to your rules, audits each change, and proves your intent is obeyed."
license = "MIT"
repository = "https://github.com/jblossey/houserules"

[dependencies]
axoupdater = { version = "=0.10.2", default-features = false, features = ["github_releases", "blocking"] }
base64 = "=0.23.1"
clap = { version = "=4.6.7", features = ["derive"] }
dirs = "=7.0.0"
globset = "=0.4.20"
indexmap = { version = "=2.14.2", features = ["serde"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
percent-encoding = "=2.3.2"
regress = "=0.12.0"
rust-embed = { version = "=8.13.0", features = ["debug-embed"] }
saphyr = { version = "=0.2.2", default-features = false }
schemars = { version = "=1.2.3", features = ["preserve_order", "indexmap2"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.11.1"
shlex = "=2.0.1"
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "time"] }
url = "=2.5.8"
walkdir = "=2.5.0"

[target."cfg(unix)".dev-dependencies]
libc = "=0.2.191"

[dev-dependencies]
jsonschema = { version = "=0.60.2", default-features = false }

# dist ships every archive with the whole crate's binaries otherwise (the four
# dev tools under src/bin/ alongside houserules itself). Restrict every dist
# target to the one binary adopters install; the dev tools stay cargo-only.
[package.metadata.dist.binaries]
x86_64-unknown-linux-musl = ["houserules"]
aarch64-unknown-linux-musl = ["houserules"]
x86_64-apple-darwin = ["houserules"]
aarch64-apple-darwin = ["houserules"]
x86_64-pc-windows-msvc = ["houserules"]
