# Config for 'dist' (https://axodotdev.github.io/cargo-dist/ -- the old
# opensource.axo.dev host no longer resolves, checked 2026-09-13). This file
# is the SOURCE for .github/workflows/release.yml: never hand-edit that file.
# Edit this file, then run `dist generate` (or `dist init` again) to
# regenerate it. Verified round-trip-safe: running `dist generate` twice with
# no config change produced a byte-identical release.yml
# (.superpowers/sdd/2026-09-06-batch-19/t1-evidence/dist-generate-round-trip.log).

[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax). Exact
# pin (security-hygiene.exact-pins): `dist init`/`dist migrate` are the only
# sanctioned way to bump this value; never hand-type a new one.
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax): the five
# target families spec 2 names (linux x64/arm64, macOS x64/arm64, Windows
# x64). The Linux legs are musl, not gnu -- this task's own choice, not an
# owner ruling (design.md 5.37 rules cargo-dist and unsigned macOS, no
# targets): ubi's libc filter (picker.rs's libc_matches, verified against
# ubi's current source) passes a musl-only asset name unfiltered on a glibc
# host but drops any glibc-named asset on a musl host, so musl-only installs
# on both, where gnu-only would fail on musl. The musl legs ship one
# statically linked binary (x86_64-unknown-linux-musl only); macOS and
# Windows link their platform runtimes.
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in: ~/.local/bin, not
# CARGO_HOME -- a toolchain-neutral binary does not belong under a
# Rust-toolchain-shaped default (HR-135, design.md 5.86). The
# shell/powershell installers add this directory to PATH themselves
# (houserules-installer.sh calls add_install_dir_to_path for .profile,
# .zshrc/.zshenv and fish's conf.d unless HOUSERULES_NO_MODIFY_PATH is
# set); the mise/ubi channel never reads this setting at all.
install-path = "~/.local/bin"
# Where to host releases
hosting = "github"
# release-please creates the GitHub release on the tag push (its own
# PAT-authenticated run, docs/runbook.md#cutting-a-release); dist only
# uploads into that release and undrafts it (a no-op on an already-
# published release). Unset (default true), dist's host job instead calls
# `gh release create` against a tag release-please already released, which
# collides (HR-118, design.md 5.77).
create-release = false
# Whether to install an updater program
install-updater = false
# Explicit for the record (already dist's own default): a sha256 file per
# archive plus a unified sha256.sum.
checksum = "sha256"
# dist's current docs (reference/config.html#pr-run-mode): "plan" runs
# `dist plan` on PRs (recommended, also the default) -- the cheap check that
# catches release-process breakage without building or uploading anything.
# "upload" builds and uploads real per-target archives on every PR instead --
# the "expensive" option the same doc names. Neither mode creates, uploads to, or
# announces a GitHub Release: the host/create/announce jobs stay gated to a
# real tag push either way (`publishing` is `!github.event.pull_request` in
# the generated workflow). `dispatch-releases` remains unset: it replaces
# tag-push with workflow_dispatch outright, which the ruled trigger (the
# tag-push chain release-please drives, spec §2) rules out.
pr-run-mode = "plan"
# Dependabot maintains the action pins inside the generated release.yml
# (HR-092): dist must not fail `plan` on that drift. The table below stays the
# regeneration seed; after a `dist generate`, Dependabot re-bumps what moved.
allow-dirty = ["ci"]
# SLSA build provenance for every release artifact (Scorecard Signed-Releases).
github-attestations = true

# Every action in the generated release.yml pinned to a full commit SHA: the
# repository's Actions policy rejects a tag ref (houserules.actions-pinned-by-sha).
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8.0.1
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
