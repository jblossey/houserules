[tools]
# The seeded CI workflow of every adapter (tests/ci_per_adapter.rs) must pass
# actionlint; a test fails when it is missing. ci.yml's checks and rust jobs get
# it from this table through jdx/mise-action.
actionlint = "1.7.12"
# Linux-only: cargo-dist backs dist-generate-check.rs, the lint step
# below. That step runs only in ci.yml's ubuntu-only checks job, so the
# rust job's macOS/Windows legs never need cargo-dist installed at all.
cargo-dist = { version = "0.32.0", os = ["linux"] }
# The Beads adapter's conformance tests (tests/tracker_conformance.rs) run this
# release of bd from its canonical repository: the old steveyegge/beads name only
# redirects. ci.yml's checks job (mise run test) and its rust job (cargo test on
# ubuntu, macos, and windows) get it from this table; a test fails when bd is
# missing. BD_VERSION in src/tracker/beads/mod.rs names the same release.
"github:gastownhall/beads" = "1.3.1"
rust = { version = "1.98.1", components = ["clippy", "rustfmt"], targets = ["x86_64-pc-windows-gnu"] }
shellcheck = "0.11.0"
"ubi:EmbarkStudios/cargo-deny" = "0.20.2"

[tasks.setup]
description = "One-command dev setup: the commit-msg hook and the houserules binary on PATH"
run = [
  "git config core.hooksPath .githooks",
  "cargo install --path crates/houserules --bin houserules",
]

[tasks.test]
description = "Run the cargo test suite"
run = "cargo test --locked"

[tasks.houserules]
description = "Front the houserules binary (built from crates/houserules); pass its subcommand after --"
run = "cargo run --quiet --bin houserules --"

[tasks.lint]
description = "shellcheck, cargo deny, a cross-target clippy run, the knowledge/backlog gates, a stale-render check, the residue gate, the vacuous-exception gate, the payload-stamp gate, then the dist-generate-check gate"
run = [
  "shellcheck tools/*.sh template/tools/*.sh template/workflows/reference/tools/*.sh .githooks/commit-msg template/workflows/reference/.githooks/commit-msg",
  "cargo deny check",
  "cargo clippy --target x86_64-pc-windows-gnu --all-targets --locked -- -D warnings",
  "mise run houserules -- check-knowledge",
  "mise run houserules -- check-backlog",
  "mise run houserules -- render --check",
  "cargo run --quiet --bin residue-gate",
  "cargo run --quiet --bin vacuous-exception-gate",
  "cargo run --quiet --bin payload-stamp-gate",
  "cargo run --quiet --bin dist-generate-check",
]

[tasks.audit]
description = "Audit a git range against the knowledge base rule package (pass --base <ref>)"
run = "mise run houserules -- audit"
